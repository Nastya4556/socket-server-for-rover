stages: # List of stages for jobs, and their order of execution
  - build
  - deploy

build-job:
  stage: build
  script:
    - docker build -t socketserver .
  tags:
    - gitlab-runner-shell-hpc12


deploy-job:
  stage: deploy
  script:
    - docker rm -f socketserver /dev/null || true
    - docker run -d --restart=always --name socketserver -p 8558:8558 -p 8855:8855  socketserver
  tags:
    - gitlab-runner-shell-hpc12
